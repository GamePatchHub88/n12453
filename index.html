<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الاختبار</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- القسم الأيسر - النتيجة -->
        <div class="result-card">
            <div class="result-header">
                <h2 class="result-title">Your Result</h2>
            </div>
            
            <div class="result-circle">
                <span class="result-score">76</span>
                <span class="result-total">of 100</span>
            </div>
            
            <div class="result-text">
                <h3 class="result-grade">Great</h3>
                <p class="result-description">
                    You scored higher than 65% of the people who have taken these tests.
                </p>
            </div>
        </div>

        <!-- القسم الأيمن - الملخص -->
        <div class="summary-card">
            <h2 class="summary-title">Summary</h2>
            
            <ul class="summary-list">
                <li class="summary-item reaction">
                    <span class="item-icon">⚡</span>
                    <span class="item-label">Reaction</span>
                    <span class="item-score"><strong>80</strong> / 100</span>
                </li>
                
                <li class="summary-item memory">
                    <span class="item-icon">💡</span>
                    <span class="item-label">Memory</span>
                    <span class="item-score"><strong>92</strong> / 100</span>
                </li>
                
                <li class="summary-item verbal">
                    <span class="item-icon">💬</span>
                    <span class="item-label">Verbal</span>
                    <span class="item-score"><strong>61</strong> / 100</span>
                </li>
                
                <li class="summary-item visual">
                    <span class="item-icon">👁️</span>
                    <span class="item-label">Visual</span>
                    <span class="item-score"><strong>73</strong> / 100</span>
                </li>
            </ul>
            
            <button class="btn-continue">Continue</button>
        </div>
    </div>
</body>
</html>
